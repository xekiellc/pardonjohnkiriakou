name: Refresh News

on:
  schedule:
    - cron: '0 7,11,15,19 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch Kiriakou news and Briefing Room episodes
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python3 << 'EOF'
          import urllib.request, urllib.parse, json, os, datetime
          import xml.etree.ElementTree as ET

          key = os.environ["NEWS_API_KEY"]
          queries = ["John Kiriakou", "Kiriakou CIA", "Kiriakou pardon", "Kiriakou whistleblower", "Kiriakou Briefing Room"]
          seen = set()
          articles = []

          # --- NewsAPI articles ---
          for q in queries:
              url = f"https://newsapi.org/v2/everything?q={urllib.parse.quote(q)}&sortBy=publishedAt&pageSize=10&language=en&apiKey={key}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = json.loads(r.read())
                  for a in data.get("articles", []):
                      if a.get("url") in seen or not a.get("title"):
                          continue
                      seen.add(a["url"])
                      articles.append({
                          "title": a["title"],
                          "url": a["url"],
                          "source": a.get("source", {}).get("name", ""),
                          "date": a.get("publishedAt", "")
                      })
              except Exception as e:
                  print(f"NewsAPI error ({q}): {e}")

          # --- YouTube: John Kiriakou's Briefing Room episodes ---
          YT_CHANNEL_ID = "UCyFoulEppT3kYN_cSt11M8Q"  # @realjohnkiriakou
          yt_url = f"https://www.youtube.com/feeds/videos.xml?channel_id={YT_CHANNEL_ID}"
          try:
              req = urllib.request.Request(yt_url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=10) as r:
                  xml_data = r.read()

              ns = {
                  "atom": "http://www.w3.org/2005/Atom",
                  "media": "http://search.yahoo.com/mrss/",
                  "yt": "http://www.youtube.com/xml/schemas/2015"
              }
              root = ET.fromstring(xml_data)
              for entry in root.findall("atom:entry", ns):
                  title_el = entry.find("atom:title", ns)
                  link_el = entry.find("atom:link", ns)
                  published_el = entry.find("atom:published", ns)
                  if title_el is None or link_el is None:
                      continue
                  video_url = link_el.get("href")
                  if not video_url or video_url in seen:
                      continue
                  seen.add(video_url)
                  articles.append({
                      "title": title_el.text,
                      "url": video_url,
                      "source": "YouTube — Briefing Room",
                      "date": published_el.text if published_el is not None else ""
                  })
          except Exception as e:
              print(f"YouTube RSS error: {e}")

          articles.sort(key=lambda x: x["date"], reverse=True)
          with open("news.json", "w") as f:
              json.dump(articles[:18], f)
          print(f"Saved {len(articles[:18])} items")
          EOF

      - name: Commit news.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "chore: refresh news $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Post to Voxxee
        run: |
          curl -s -X POST https://xenchee.netlify.app/.netlify/functions/pipeline-post \
            -H "Content-Type: application/json" \
            -H "x-pipeline-secret: ${{ secrets.PIPELINE_SECRET }}" \
            -d '{
              "slug": "pardon-john-kiriakou",
              "title": "🕊️ Pardon John Kiriakou — Latest News",
              "summary": "The latest news on John Kiriakou, CIA whistleblower and advocate for government accountability.",
              "url": "https://pardonjohnkiriakou.com"
            }'
