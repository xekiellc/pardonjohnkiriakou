name: Refresh News

on:
  schedule:
    - cron: '0 7,11,15,19 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch Kiriakou news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os, datetime

          key = os.environ["NEWS_API_KEY"]
          queries = ["John Kiriakou", "Kiriakou CIA", "Kiriakou pardon", "Kiriakou whistleblower"]
          seen = set()
          articles = []

          for q in queries:
              url = f"https://newsapi.org/v2/everything?q={urllib.parse.quote(q)}&sortBy=publishedAt&pageSize=10&language=en&apiKey={key}"
              try:
                  import urllib.parse
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = json.loads(r.read())
                  for a in data.get("articles", []):
                      if a.get("url") in seen or not a.get("title"):
                          continue
                      seen.add(a["url"])
                      articles.append({
                          "title": a["title"],
                          "url": a["url"],
                          "source": a.get("source", {}).get("name", ""),
                          "date": a.get("publishedAt", "")
                      })
              except Exception as e:
                  print(f"Error: {e}")

          articles.sort(key=lambda x: x["date"], reverse=True)
          with open("news.json", "w") as f:
              json.dump(articles[:18], f)
          print(f"Saved {len(articles[:18])} articles")
          EOF

      - name: Commit news.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "chore: refresh news $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
